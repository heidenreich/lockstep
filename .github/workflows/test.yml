name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # A short, repeatable bot run: fails on a crash, or if stalls stop being rare.
      - run: node sim/run4.js check 10
        env:
          SEED: "1"
      # The page in a real browser: start, drill, map, briefing, a fight, resume, phone.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
