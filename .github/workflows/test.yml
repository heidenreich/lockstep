name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # A short bot run: catches rule changes that crash or stall the game.
      - run: node sim/run4.js check 10
